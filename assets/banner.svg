<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .pulsing-glow {
        animation: pulse 4s ease-in-out infinite alternate;
      }
      .drifting-grid {
        animation: drift 15s linear infinite;
      }
      .badge-glow {
        animation: badgePulse 3s ease-in-out infinite alternate;
      }
      .node-orbit {
        animation: orbit 10s ease-in-out infinite alternate;
      }
      @keyframes pulse {
        0% { opacity: 0.25; transform: scale(0.98); }
        100% { opacity: 0.65; transform: scale(1.02); }
      }
      @keyframes badgePulse {
        0% { stroke-opacity: 0.3; }
        100% { stroke-opacity: 0.9; }
      }
      @keyframes orbit {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-8px); }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="380" fill="url(#bgGrad)" rx="16" />

  <!-- Animated Glowing Orbs in Background -->
  <circle cx="200" cy="100" r="140" fill="#38bdf8" opacity="0.15" filter="url(#glow)" class="pulsing-glow" />
  <circle cx="1000" cy="280" r="150" fill="#c084fc" opacity="0.15" filter="url(#glow)" class="pulsing-glow" />
  <circle cx="650" cy="180" r="180" fill="#818cf8" opacity="0.1" filter="url(#glow)" class="pulsing-glow" />

  <!-- Tech Grid Background Overlay -->
  <g stroke="#334155" stroke-width="0.8" opacity="0.25">
    <line x1="100" y1="0" x2="100" y2="380" />
    <line x1="250" y1="0" x2="250" y2="380" />
    <line x1="400" y1="0" x2="400" y2="380" />
    <line x1="550" y1="0" x2="550" y2="380" />
    <line x1="700" y1="0" x2="700" y2="380" />
    <line x1="850" y1="0" x2="850" y2="380" />
    <line x1="1000" y1="0" x2="1000" y2="380" />
    <line x1="1150" y1="0" x2="1150" y2="380" />

    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="220" x2="1200" y2="220" />
    <line x1="0" y1="300" x2="1200" y2="300" />
  </g>

  <!-- Border Highlight with subtle gradient -->
  <rect width="1196" height="376" x="2" y="2" rx="15" fill="none" stroke="url(#titleGrad)" stroke-width="1.5" opacity="0.4" />

  <!-- Content Group -->
  <g transform="translate(60, 45)">
    <!-- Top Micro Tag -->
    <g class="node-orbit">
      <rect x="0" y="0" width="280" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" class="badge-glow" />
      <text x="14" y="21" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="1">🛍️ ENTERPRISE &amp; OPEN SOURCE</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="95" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5">
      Retail Assortment Planning
    </text>

    <!-- Subtitle -->
    <text x="0" y="145" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="500">
      The Curated Matrix of Merchandise Optimization, Choice Modeling &amp; Demand AI
    </text>

    <!-- Description -->
    <text x="0" y="182" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400">
      Empowering enterprise retail decision-makers with state-of-the-art SaaS architectures and modular open-source toolkits.
    </text>

    <!-- Architectural Pipeline Badges -->
    <g transform="translate(0, 222)">
      <!-- Badge 1: Demand Forecasting -->
      <g>
        <rect x="0" y="0" width="160" height="42" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
        <text x="14" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">📈 Demand Forecast</text>
      </g>
      <text x="175" y="27" fill="#64748b" font-family="sans-serif" font-size="18">➔</text>

      <!-- Badge 2: Choice Modeling -->
      <g transform="translate(205, 0)">
        <rect x="0" y="0" width="150" height="42" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="1.2" />
        <text x="14" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🧠 Choice Models</text>
      </g>
      <text x="370" y="27" fill="#64748b" font-family="sans-serif" font-size="18">➔</text>

      <!-- Badge 3: Assortment Optimization -->
      <g transform="translate(400, 0)">
        <rect x="0" y="0" width="175" height="42" rx="8" fill="#1e293b" stroke="#c084fc" stroke-width="1.2" />
        <text x="14" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🎯 Assortment Solver</text>
      </g>
      <text x="590" y="27" fill="#64748b" font-family="sans-serif" font-size="18">➔</text>

      <!-- Badge 4: Inventory & Allocation -->
      <g transform="translate(620, 0)">
        <rect x="0" y="0" width="175" height="42" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1.2" />
        <text x="14" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">📦 Inventory Control</text>
      </g>
      <text x="810" y="27" fill="#64748b" font-family="sans-serif" font-size="18">➔</text>

      <!-- Badge 5: Execution & Margin -->
      <g transform="translate(840, 0)">
        <rect x="0" y="0" width="165" height="42" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2" />
        <text x="14" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">💰 Margin Strategy</text>
      </g>
    </g>
  </g>
</svg>
